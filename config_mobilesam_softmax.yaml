wandb:
  enabled: true
  project: UniAD-MVTec-MobileSAM
  entity: null
  name: mobilesam_minmax_500_256_256
  tags:
    - mvtec
    - anomaly-detection
    - mobilesam
    - minmax-anomaly-map
  notes: UniAD with MobileSAM + min-max normalization for anomaly maps
  mode: online
  group: null
  job_type: train
  resume: allow
  run_id: null
  dir: null
  login: true
  api_key: 0f2ca680372a916c31aab5ede7bbefab410fe503

version: v1.0.0
random_seed: 133
port: 11111

dataset:
  type: custom
  image_reader:
    type: opencv
    kwargs:
      image_dir: ./data/MVTec-AD/mvtec_anomaly_detection
      color_mode: RGB
  train:
    meta_file: ./data/MVTec-AD/train.json
    rebalance: false
    hflip: false
    vflip: false
    rotate: false
  test:
    meta_file: ./data/MVTec-AD/test.json
  input_size:
    - 224
    - 224
  pixel_mean:
    - 0.485
    - 0.456
    - 0.406
  pixel_std:
    - 0.229
    - 0.224
    - 0.225
  batch_size: 8
  workers: 4

criterion:
  - name: CombinedMSESpatialFocalLoss
    type: CombinedMSESpatialFocalLoss
    kwargs:
      weight: 1.0
      mse_weight: 0.4
      spatial_focal_weight: 0.6
      beta: 2
      epsilon: 0.001
      loss_type: mse
      region_size: 3
      overlap: False

trainer:
  max_epoch: 500
  clip_max_norm: 0.1
  val_freq_epoch: 10
  print_freq_step: 100
  tb_freq_step: 1
  lr_scheduler:
    type: StepLR
    kwargs:
      step_size: 500
      gamma: 0.1
  optimizer:
    type: AdamW
    kwargs:
      lr: 0.0001
      betas:
        - 0.9
        - 0.999
      weight_decay: 0.0001

saver:
  auto_resume: true
  always_save: false
  load_path: null
  save_dir: checkpoints/
  log_dir: log/

evaluator:
  save_dir: result_eval_mobilesam_softmax
  key_metric: mean_pixel_auc
  metrics:
    auc:
      - name: std
      - name: max
        kwargs:
          avgpool_size:
            - 16
            - 16
      - name: pixel
  vis_compound:
    save_dir: ./tools/vis_compound
    max_score: null
    min_score: null

frozen_layers:
  - backbone

net:
  - name: backbone
    type: models.backbones.mobilesam_vit_t
    frozen: true
    kwargs:
      pretrained: true
      outlayers:
        - 4
  - name: neck
    prev: backbone
    type: models.necks.MobileSAMBypass
    kwargs:
      outstrides:
        - 16
      normalize_features: false
      feature_norm_type: layer
  - name: reconstruction
    prev: neck
    type: models.reconstructions.UniADMemory
    kwargs:
      pos_embed_type: learned
      hidden_dim: 256
      nhead: 8
      num_encoder_layers: 4
      num_decoder_layers: 4
      dim_feedforward: 1024
      feature_size:
        - 14
        - 14
      dropout: 0.1
      activation: relu
      normalize_before: false
      memory_mode: both
      channel_memory_size: 256
      spatial_memory_size: 256
      feature_jitter:
        scale: 20.0
        prob: 1.0
      neighbor_mask:
        neighbor_size:
          - 7
          - 7
        mask:
          - false
          - false
          - false
      save_recon:
        save_dir: result_recon
      initializer:
        method: xavier_uniform
      # Enable min-max normalization for anomaly maps  
      use_softmax_anomaly_map: true  # Actually does min-max now