wandb:
  enabled: false # Tắt wandb cho local hoặc set true nếu muốn dùng
  project: "UniAD-MVTec-Local"
  entity: null
  name: "local_500_256_256_spatial_focal_only_mse_non"
  tags: ["mvtec", "anomaly-detection", "spatial-focal-loss", "local"]
  notes: "UniAD with Spatial Region Focal Loss (pure) on MVTec-AD dataset - Local Training"
  mode: "online"
  group: null
  job_type: "train"
  resume: "allow"
  run_id: null
  dir: null
  login: true
  api_key: null # Xóa API key hoặc thay bằng của bạn

version: "v1.0.0"
random_seed: 133
port: 11111

dataset:
  type: "custom"
  image_reader:
    type: "opencv"
    kwargs:
      image_dir: "./data/MVTec-AD" # Đường dẫn local
      color_mode: "RGB"
  train:
    meta_file: "./data/MVTec-AD/train.json" # Đường dẫn local
    rebalance: false
    hflip: false
    vflip: false
    rotate: false
  test:
    meta_file: "./data/MVTec-AD/test.json" # Đường dẫn local
  input_size: [224, 224]
  pixel_mean: [0.485, 0.456, 0.406]
  pixel_std: [0.229, 0.224, 0.225]
  batch_size: 8 # Có thể giảm xuống 4 hoặc 2 nếu GPU nhỏ
  workers: 4 # Có thể giảm xuống 2 nếu CPU yếu

# === SPATIAL FOCAL LOSS ONLY ===
criterion:
  - name: "FeatureSpatialFocalRegionLoss"
    type: "FeatureSpatialFocalRegionLoss"
    kwargs:
      weight: 1.0
      beta: 2.0 # Higher focusing strength for spatial regions
      epsilon: 0.001
      loss_type: "mse"
      region_size: 3 # 3x3 regions (14x14 -> ~25 regions)
      overlap: false # Non-overlapping regions

trainer:
  max_epoch: 500 # Có thể giảm xuống 100 để test nhanh
  clip_max_norm: 0.1
  val_freq_epoch: 10
  print_freq_step: 100
  tb_freq_step: 1
  lr_scheduler:
    type: "StepLR"
    kwargs:
      step_size: 500
      gamma: 0.1
  optimizer:
    type: "AdamW"
    kwargs:
      lr: 0.0001
      betas: [0.9, 0.999]
      weight_decay: 0.0001

saver:
  auto_resume: true # Tự động resume nếu có checkpoint
  always_save: false
  load_path: null # Để null hoặc đường dẫn model từ Kaggle
  save_dir: "checkpoints/"
  log_dir: "log/"

evaluator:
  save_dir: "result_eval_temp"
  key_metric: "mean_pixel_auc"
  metrics:
    auc:
      - name: "std"
      - name: "max"
        kwargs:
          avgpool_size: [16, 16]
      - name: "pixel"
  vis_compound:
    save_dir: "vis_compound"
    max_score: null
    min_score: null

frozen_layers:
  - "backbone"

net:
  - name: "backbone"
    type: "models.backbones.efficientnet_b4"
    frozen: true
    kwargs:
      pretrained: true
      outlayers: [1, 2, 3, 4]
  - name: "neck"
    prev: "backbone"
    type: "models.necks.MFCN"
    kwargs:
      outstrides: [16]
  - name: "reconstruction"
    prev: "neck"
    type: "models.reconstructions.UniADMemory"
    kwargs:
      pos_embed_type: "learned"
      hidden_dim: 256
      nhead: 8
      num_encoder_layers: 4
      num_decoder_layers: 4
      dim_feedforward: 1024
      feature_size: [14, 14]
      dropout: 0.1
      activation: "relu"
      normalize_before: false
      channel_memory_size: 256
      spatial_memory_size: 256
      feature_jitter:
        scale: 20.0
        prob: 1.0
      neighbor_mask:
        neighbor_size: [7, 7]
        mask: [false, false, false]
      save_recon:
        save_dir: "result_recon"
      initializer:
        method: "xavier_uniform"
